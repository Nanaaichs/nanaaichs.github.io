short_bio:
  en: Ph.D. student focusing on satellite communications, 5G NR Non-Terrestrial Networks, physical-layer signal processing, and communication-system simulation.
  zh: 博士研究生，研究方向主要包括卫星通信、5G NR 非地面网络（NTN）、物理层信号处理与通信系统仿真。
bio:
  en: My work focuses on satellite-terrestrial integrated communication systems, with particular interest in 5G NR NTN, LEO satellite communications, synchronization, receiver processing, and reproducible communication-system simulation.
  zh: 主要研究卫星与地面融合通信系统，重点关注 5G NR NTN、低轨卫星通信、同步与接收机处理，以及可复现的通信系统仿真。
