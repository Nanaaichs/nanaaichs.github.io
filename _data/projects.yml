    zh: 已完成
  summary:
    en: Desktop protocol generation and UDP transmission application developed with C++ and Qt.
    zh: 基于 C++ 与 Qt 开发的桌面协议报文生成、UDP 发送与记录管理应用。
  technologies:
  - C++11
  - Qt
  - UDP
  - SQLite
  - XML
  - qmake
  overview:
    en: CITEL-T-007 is a desktop application for XML-defined protocol parsing, field generation, UDP transmission, and transmission-record persistence.
    zh: CITEL-T-007 是一个桌面应用，用于解析 XML 定义的协议、生成字段、通过 UDP 发送报文并持久化传输记录。
  problem:
    en: The application needs to turn course-defined XML protocol descriptions into reproducible transmitted bytes while preserving each send attempt as an auditable record.
    zh: 该应用需要将课程定义的 XML 协议描述可靠转换为可复现的发送字节流，同时保留每次发送尝试的可审计记录。
  contribution:
    en:
    - Software architecture
    - XML protocol parsing
    - Configurable data generation
    - UDP transmission control
    - SQLite persistence
    - GUI integration and acceptance workflow
    zh:
    - 软件架构设计
    - XML 协议解析
    - 可配置数据生成
    - UDP 发送控制
    - SQLite 数据持久化
    - GUI 集成与验收流程
  architecture:
    en:
    - XML Protocol Definition
    - Protocol Parser
    - Protocol Definition
    - Data Generator
    - UDP Send Controller
    - Transmission Repository
    - Main Window
    zh:
    - XML 协议定义
    - 协议解析器
    - 协议内存定义
    - 数据生成器
    - UDP 发送控制器
    - 传输记录仓库
    - 主界面
  features:
    en:
    - XML-based protocol definitions
    - Configurable field generation
    - UDP packet transmission
    - SQLite transmission records
    - Progress and run-status monitoring
    zh:
    - 基于 XML 的协议定义
    - 可配置字段生成
    - UDP 报文发送
    - SQLite 传输记录
    - 发送进度与运行状态监控
  outcomes:
    en:
    - End-to-end XML-to-UDP desktop workflow
    - Persistent transmission records suitable for acceptance and debugging
    zh:
    - 形成从 XML 协议定义到 UDP 发送的端到端桌面流程
    - 形成可用于验收与调试的持久化传输记录
