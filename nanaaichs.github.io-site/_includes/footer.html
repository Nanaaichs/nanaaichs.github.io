<footer class="site-footer">
  <div class="container footer-wrap">
    <span>© {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
    <span class="footer-links">
      {% for link in site.data.links %}
        {% if link.enabled %}
          <a href="{{ link.url }}">{{ link.name }}</a>
        {% endif %}
      {% endfor %}
    </span>
  </div>
</footer>
