title: Li Shan
description: Personal academic website and engineering portfolio
url: https://nanaaichs.github.io
baseurl: ''
lang: en
markdown: kramdown
collections:
  projects:
    output: true
defaults:
- scope:
    path: ''
    type: projects
  values:
    layout: project
- scope:
    path: ''
    type: posts
  values:
    layout: post
exclude:
- README.md
- MAINTENANCE.md
- templates
- scripts
- Gemfile
- Gemfile.lock
