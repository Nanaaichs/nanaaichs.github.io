title: 黎山
description: Personal academic website and engineering portfolio
url: "https://nanaaichs.github.io"
baseurl: ""
lang: zh-CN
markdown: kramdown
permalink: /writing/:year/:month/:day/:title/

author:
  name: 黎山

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - MAINTENANCE.md
  - templates
  - Gemfile
  - Gemfile.lock
