<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description"
          content="{{ site.description }}">

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header>
    <div class="container">

        <nav>

            <a class="site-name"
               href="{{ '/' | relative_url }}">
                {{ site.title }}
            </a>

            <div class="nav-links">

                <a href="{{ '/' | relative_url }}">
                    Home
                </a>

                <a href="{{ '/research/' | relative_url }}">
                    Research
                </a>

                <a href="{{ '/projects/' | relative_url }}">
                    Projects
                </a>

                <a href="{{ '/publications/' | relative_url }}">
                    Publications
                </a>

                <a href="{{ '/awards/' | relative_url }}">
                    Awards
                </a>

                <a href="{{ '/writing/' | relative_url }}">
                    Writing
                </a>

                <a href="{{ '/about/' | relative_url }}">
                    About
                </a>

            </div>

        </nav>

    </div>
</header>


<main>

    {{ content }}

</main>


<footer>

    <div class="container">

        © {{ site.time | date: "%Y" }} {{ site.author.name }}

    </div>

</footer>

</body>

</html>
