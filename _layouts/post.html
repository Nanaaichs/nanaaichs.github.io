---
layout: default
---
<article class="container page-shell post-detail">
  <p class="eyebrow">Writing</p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.category %} · {{ page.category }}{% endif %}</p>
  {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  <div class="prose">{{ content }}</div>
  <p class="back-link"><a href="{{ '/writing/' | relative_url }}">← Back to Writing</a></p>
</article>
